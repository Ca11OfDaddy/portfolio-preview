<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="gcTitle gcDesc">
  <title id="gcTitle">Cognitive gaming evidence — game types to benefits</title>
  <desc id="gcDesc">Dark abstract hero: game controller silhouette and skill nodes linked to cognitive domains</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1522"/>
      <stop offset="55%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#1a2740"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6fd0" stop-opacity=".15"/>
      <stop offset="50%" stop-color="#8fb3ff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#2f6fd0" stop-opacity=".15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <ellipse cx="600" cy="210" rx="420" ry="140" fill="url(#glow)" filter="url(#soft)"/>
  <!-- grid dots -->
  <g fill="#8fb3ff" opacity=".12">
    <circle cx="80" cy="60" r="2"/><circle cx="160" cy="100" r="2"/><circle cx="240" cy="50" r="2"/>
    <circle cx="960" cy="70" r="2"/><circle cx="1040" cy="110" r="2"/><circle cx="1120" cy="55" r="2"/>
    <circle cx="100" cy="340" r="2"/><circle cx="200" cy="370" r="2"/><circle cx="1100" cy="350" r="2"/>
  </g>
  <!-- skill graph nodes -->
  <g stroke="#8fb3ff" stroke-width="1.5" fill="none" opacity=".55">
    <line x1="280" y1="210" x2="420" y2="120"/>
    <line x1="280" y1="210" x2="420" y2="210"/>
    <line x1="280" y1="210" x2="420" y2="300"/>
    <line x1="420" y1="120" x2="560" y2="160"/>
    <line x1="420" y1="210" x2="560" y2="210"/>
    <line x1="420" y1="300" x2="560" y2="260"/>
    <line x1="560" y1="160" x2="720" y2="210"/>
    <line x1="560" y1="210" x2="720" y2="210"/>
    <line x1="560" y1="260" x2="720" y2="210"/>
  </g>
  <g>
    <circle cx="280" cy="210" r="28" fill="#1d3a6e" stroke="#8fb3ff" stroke-width="2"/>
    <text x="280" y="216" text-anchor="middle" fill="#e6eaf2" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Play</text>
    <circle cx="420" cy="120" r="22" fill="#182134" stroke="#2f6fd0" stroke-width="2"/>
    <text x="420" y="125" text-anchor="middle" fill="#a3adc2" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Action</text>
    <circle cx="420" cy="210" r="22" fill="#182134" stroke="#2f6fd0" stroke-width="2"/>
    <text x="420" y="215" text-anchor="middle" fill="#a3adc2" font-family="system-ui,sans-serif" font-size="11" font-weight="600">RTS</text>
    <circle cx="420" cy="300" r="22" fill="#182134" stroke="#2f6fd0" stroke-width="2"/>
    <text x="420" y="305" text-anchor="middle" fill="#a3adc2" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Puzzle</text>
    <circle cx="560" cy="160" r="20" fill="#141c2c" stroke="#8fb3ff" stroke-width="1.5"/>
    <text x="560" y="164" text-anchor="middle" fill="#8fb3ff" font-family="system-ui,sans-serif" font-size="10">Attend</text>
    <circle cx="560" cy="210" r="20" fill="#141c2c" stroke="#8fb3ff" stroke-width="1.5"/>
    <text x="560" y="214" text-anchor="middle" fill="#8fb3ff" font-family="system-ui,sans-serif" font-size="10">Flex</text>
    <circle cx="560" cy="260" r="20" fill="#141c2c" stroke="#8fb3ff" stroke-width="1.5"/>
    <text x="560" y="264" text-anchor="middle" fill="#8fb3ff" font-family="system-ui,sans-serif" font-size="10">Speed</text>
    <circle cx="720" cy="210" r="32" fill="#1d3a6e" stroke="#8fb3ff" stroke-width="2.5"/>
    <text x="720" y="206" text-anchor="middle" fill="#e6eaf2" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Effect</text>
    <text x="720" y="222" text-anchor="middle" fill="#8fb3ff" font-family="system-ui,sans-serif" font-size="11">size g</text>
  </g>
  <!-- simplified controller -->
  <g transform="translate(920,175)" fill="none" stroke="#8fb3ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M-70 10c0-22 14-40 36-40h20c8 0 14 4 18 10l8 14c4 6 10 10 18 10h16c8 0 14-4 18-10l8-14c4-6 10-10 18-10h20c22 0 36 18 36 40v8c0 18-12 32-28 32h-18c-8 0-14-4-18-10l-6-10c-4-6-10-10-18-10h-28c-8 0-14 4-18 10l-6 10c-4 6-10 10-18 10h-18c-16 0-28-14-28-32v-8z" fill="#182134"/>
    <circle cx="-28" cy="8" r="7" fill="#2f6fd0" stroke="none"/>
    <line x1="-28" y1="-2" x2="-28" y2="18"/><line x1="-38" y1="8" x2="-18" y2="8"/>
    <circle cx="48" cy="0" r="5" fill="#8fb3ff" stroke="none"/>
    <circle cx="62" cy="12" r="5" fill="#2f6fd0" stroke="none"/>
    <circle cx="34" cy="12" r="5" fill="#8fb3ff" stroke="none" opacity=".6"/>
    <circle cx="48" cy="24" r="5" fill="#2f6fd0" stroke="none" opacity=".6"/>
  </g>
  <text x="60" y="380" fill="#a3adc2" font-family="system-ui,sans-serif" font-size="14" letter-spacing=".04em">PORTFOLIO DEMO · PUBLISHED META-ANALYSES · NOT A SHIPPED PRODUCT</text>
</svg>
